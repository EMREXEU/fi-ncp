<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EMREX – Käyttökatko</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #5b6875;
    --accent: #e8a200;
    --link: #0b5cad;
    --border: #dde3e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --card: #1b222b;
      --text: #e6ebf0;
      --muted: #9aa7b4;
      --accent: #f0b429;
      --link: #6cb2ff;
      --border: #2b3541;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 6px solid var(--accent);
    border-radius: 8px;
    padding: 32px;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 1.5rem;
    line-height: 1.3;
  }
  p { margin: 0 0 16px; }
  a { color: var(--link); }
  .sign { margin-top: 24px; color: var(--muted); }
  .sign strong { color: var(--text); }
  @media (max-width: 480px) {
    main { padding: 24px 20px; }
    body { font-size: 17px; }
  }
</style>
</head>
<body>
<main role="alert">
  <h1>EMREXissä on käyttökatko</h1>
  <p>Hei,</p>
  <p>EMREXissä on tänään käyttökatko klo 9 alkaen. Ilmoitamme, kun palvelu on taas normaalisti käytettävissä.</p>
  <p>Pahoittelemme häiriötä!</p>
  <p class="sign">Ystävällisin terveisin,<br><strong>EMREX-tiimi</strong></p>
</main>
</body>
</html>
